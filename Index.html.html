<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trashshot</title>
<style>
:root{--bg:#f6f8f5;--fg:#111b14;--card:#fff;--muted:#4a5a4f;--line:#cfd9d1;--acc:#157a45;--bad:#c93a1e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--fg:#f0f6f1;--card:#19231c;--muted:#b3c5b8;--line:#2b3a2f;--acc:#1e9e5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101712;--fg:#f0f6f1;--card:#19231c;--muted:#b3c5b8;--line:#2b3a2f;--acc:#1e9e5a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:20px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:130px}
header{padding:16px 16px 4px}h1{margin:0;font-size:32px}h1 span{color:var(--acc)}
.sub{margin:2px 0 0;color:var(--muted);font-size:18px}
.stats{display:flex;gap:12px;padding:10px 16px 0}.stat{flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;text-align:center;font-size:18px;line-height:1.2}.stat b{display:block;font-size:36px}.stat.ok b{color:var(--acc)}.stat.open b{color:var(--bad)}
.mapwrap{margin:12px 16px 6px;border-radius:16px;overflow:hidden;border:2px solid var(--line);position:relative}
svg{display:block;width:100%;height:auto;touch-action:none}.pin{cursor:pointer}.zoom{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:8px}
.donate{position:absolute;left:10px;top:10px;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:17px;font-weight:700}
.amts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.amts a,.amts button{display:block;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:16px;font:inherit;font-size:24px;font-weight:700;background:var(--acc);color:#fff}.amts button:disabled{opacity:.45}
.own{display:flex;gap:8px}.own input{flex:1;min-width:0;font:inherit;font-size:22px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}.own a,.own button{flex:none;display:block;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-size:22px;font-weight:700;background:var(--acc);color:#fff;text-decoration:none}.own button:disabled{opacity:.45}.zoom button{width:40px;height:40px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:24px;font-weight:700;line-height:1;padding:0}
.hint{position:absolute;left:8px;right:8px;top:8px;background:var(--acc);color:#fff;border-radius:12px;padding:10px;font-size:19px;text-align:center;font-weight:600}
.legend{margin:0 16px;font-size:18px;color:var(--muted)}.legend small{display:block;font-size:13px;margin-top:6px}.legend a{color:inherit}
.big{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border:0;border-radius:20px;padding:20px;font-size:26px;font-weight:700;text-align:center;box-shadow:0 6px 18px #0004;display:block}
.big input{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;border-top:2px solid var(--line);box-shadow:0 -8px 30px #0004;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:55vh;overflow:auto;z-index:5}
.sheet[hidden]{display:none}.sheet p{margin:0 0 12px;font-size:22px;font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:18px;font:inherit;font-size:24px;font-weight:700;background:var(--acc);color:#fff;margin-top:10px}.btn.sec{background:var(--line);color:var(--fg);font-size:20px;padding:12px;font-weight:600}
.photo{width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-bottom:10px}
.status{font-size:14px;color:var(--muted);text-align:center;margin:8px 0 0}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--acc);color:#fff;border-radius:14px;padding:14px;font-size:20px;text-align:center;z-index:9}
</style></head><body>

<script>
const LS='trashshot_reports',W=1419,H=965,BB={"n": 49.77047, "s": 49.71619, "w": 8.03203, "e": 8.15555};

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const merc=a=>Math.log(Math.tan(Math.PI/4+a*Math.PI/360)),unmerc=y=>(2*Math.atan(Math.exp(y))-Math.PI/2)*180/Math.PI;

const DONATE_LINK='',DONATE_WHO='';

  $('sheet').innerHTML=`<p>💚 Trashshot unterstützen</p><p style="font-weight:400;font-size:18px">${ok?(DONATE_WHO?'Ihre Spende geht an: '+esc(DONATE_WHO)+'. ':'')+'Sie bezahlen sicher über PayPal. Wählen Sie einen Betrag:':'Die Spendenfunktion ist noch in Vorbereitung. Bald können Sie hier einen Betrag von 1 bis 10 Euro spenden.'}</p><div class="amts">${[1,2,5,10].map(a=>ok?`<a href="${esc(DONATE_LINK.replace(/\/$/,''))}/${a}EUR" target="_blank" rel="noopener">${a} €</a>`:`<button disabled>${a} €</button>`).join('')}</div><p style="font-weight:400;font-size:18px;margin:14px 0 6px">Oder ein eigener Betrag (1 bis 100 €):</p><div class="own"><input id="own" type="number" inputmode="decimal" min="1" max="100" step="0.01" placeholder="z. B. 7,50"${ok?'':' disabled'}>${ok?'<a id="ownGo" target="_blank" rel="noopener">Spenden</a>':'<button disabled>Spenden</button>'}</div><p id="ownErr" style="font-weight:400;font-size:16px;color:var(--bad);margin:6px 0 0"></p><button class="btn sec" id="x">Schließen</button>`;
  $('x').onclick=closeSheet;

function dist(){const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)}
function setVB(nx,ny,nw){nw=Math.max(W/6,Math.min(W,nw));const nh=nw*H/W;vb={x:Math.max(0,Math.min(W-nw,nx)),y:Math.max(0,Math.min(H-nh,ny)),w:nw,h:nh};$('map').setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);render()}
function zoomAt(f,fx,fy){const nw=Math.max(W/6,Math.min(W,vb.w/f)),nh=nw*H/W;setVB(vb.x+fx*vb.w-fx*nw,vb.y+fy*vb.h-fy*nh,nw)}
$('zin').onclick=()=>zoomAt(1.7,.5,.5);$('zout').onclick=()=>zoomAt(1/1.7,.5,.5);
$('map').addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===1)moved=0;if(ptrs.size===2)lastD=dist()});
$('map').addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const r=$('map').getBoundingClientRect(),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>8)setVB(vb.x-dx*vb.w/r.width,vb.y-dy*vb.h/r.height,vb.w)}
  else if(ptrs.size===2){moved=99;const d=dist(),v=[...ptrs.values()];if(lastD)zoomAt(d/lastD,((v[0].x+v[1].x)/2-r.left)/r.width,((v[0].y+v[1].y)/2-r.top)/r.height);lastD=d}
});
const up=e=>{ptrs.delete(e.pointerId);lastD=0};
$('map').addEventListener('pointerup',up);$('map').addEventListener('pointercancel',up);$('map').addEventListener('pointerleave',up);
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(reports))}catch(e){}}
function useLocal(){db=null;reports=lsLoad().sort((a,b)=>b.created-a.created);$('mode').textContent='Meldungen nur auf diesem Gerät';render()}
async function init(){
  render();let d=null;
  try{d=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),4000))])}catch(e){}
  if(!d){useLocal();return}
  db=d;
  try{d.collection('reports').orderBy('created','desc').onSnapshot(s=>{reports=s.docs.map(x=>Object.assign({id:x.id},x.data()));$('mode').textContent='Meldungen für alle sichtbar';render()},()=>useLocal())}catch(e){useLocal()}
}
const PIN='M0 0C-9-12-13-19-13-25a13 13 0 1 1 26 0c0 6-4 13-13 25z';
function pinG(la,lo,fill,inner,id){const p=toPx(la,lo);return `<g class="pin" ${id?`data-id="${esc(id)}"`:''} transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${(4.5*vb.w/W).toFixed(2)})"><path d="${PIN}" fill="${fill}" stroke="#fff" stroke-width="2"/>${inner}</g>`}
function render(){
  let s='';
  reports.filter(r=>r.lat!=null).forEach(r=>{const c=r.status==='clean';s+=pinG(r.lat,r.lon,c?'#1e9e5a':'#d9482b',`<text y="-19" text-anchor="middle" font-size="13">${c?'✓':'🗑️'}</text>`,r.id)});
  if(pick)s+=pinG(pick.lat,pick.lon,'#2f6fed','<circle cy="-25" r="5" fill="#fff"/>','');
  $('pins').innerHTML=s;
  const open=reports.filter(r=>r.status!=='clean').length;$('nOpen').textContent=open;$('nDone').textContent=reports.length-open;
}
$('map').addEventListener('click',e=>{
  if(moved>8){moved=0;return}
  const pin=e.target.closest('.pin');
  if(pin&&!picking&&pin.dataset.id){openDetail(pin.dataset.id);return}
  if(!picking)return;
  const r=$('map').getBoundingClientRect();

  render();stepConfirm(false);
});
function closeSheet(){$('sheet').hidden=true;$('fab').style.display='';picking=false;pick=null;photo=null;const h=document.querySelector('.hint');if(h)h.remove();render()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};img.src=fr.result};fr.readAsDataURL(file)})}
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{photo=await shrink(f)}catch(x){toast('Das Foto konnte nicht geladen werden.');return}

function manual(msg){
  picking=true;pick=null;render();
  if(!document.querySelector('.hint'))$('mapwrap').insertAdjacentHTML('beforeend','<div class="hint">Wo liegt der Müll?<br>Tippen Sie auf die Karte.</div>');
  $('sheet').hidden=false;$('sheet').innerHTML=`<p>${msg?msg+'<br>':''}Tippen Sie oben auf die Karte, wo der Müll liegt.</p><button class="btn sec" id="cancel">Abbrechen</button>`;
  $('cancel').onclick=closeSheet;
}
function askGPS(){
  $('sheet').hidden=false;$('sheet').innerHTML='<p>📍 Ihr Standort wird gesucht …<br><small style="font-weight:400">Bitte tippen Sie auf „Erlauben“, wenn Sie gefragt werden.</small></p><button class="btn sec" id="cancel">Abbrechen</button>';
  $('cancel').onclick=closeSheet;
  if(!navigator.geolocation){manual('');return}
  let done=false;const t=setTimeout(()=>{if(!done){done=true;manual('Der Standort wurde nicht gefunden.')}},12000);
  try{navigator.geolocation.getCurrentPosition(p=>{
    if(done)return;done=true;clearTimeout(t);
    const la=p.coords.latitude,lo=p.coords.longitude;
    if(la<BB.s||la>BB.n||lo<BB.w||lo>BB.e){manual('Sie sind nicht im Kartengebiet.');return}
    pick={lat:la,lon:lo};render();stepConfirm(true);
  },err=>{if(done)return;done=true;clearTimeout(t);manual(err&&err.code===1?'Standort nicht erlaubt.':'Der Standort wurde nicht gefunden.')},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
  catch(e){done=true;clearTimeout(t);manual('')}
}

  $('cancel').onclick=closeSheet;
  const o=$('other');if(o)o.onclick=()=>manual('');
  $('send').onclick=async()=>{
    const r={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),lat:pick.lat,lon:pick.lon,photo,status:'open',created:Date.now()};
    $('send').disabled=true;
    try{if(db)await db.collection('reports').doc(r.id).set(r);else{reports.unshift(r);lsSave()}}catch(e){toast('Das hat nicht geklappt. Bitte nochmal versuchen.');$('send').disabled=false;return}
    closeSheet();toast('Danke! Ihre Meldung ist auf der Karte.');
  };
}
function openDetail(id){
  const r=reports.find(x=>x.id===id);if(!r)return;
  const done=r.status==='clean';
  $('fab').style.display='none';$('sheet').hidden=false;
  $('sheet').innerHTML=`<p>${done?'🟢 Ist sauber':'🔴 Hier liegt Müll'}<br><small style="font-weight:400;color:var(--muted)">gemeldet am ${fmt(r.created)}</small></p>${r.photo?`<img class="photo" src="${r.photo}" alt="Foto">`:''}${done?'':'<button class="btn" id="ok">✅ Ich habe es aufgeräumt</button>'}<button class="btn sec" id="x">Schließen</button>`;
  $('x').onclick=closeSheet;
  const ok=$('ok');if(ok)ok.onclick=async()=>{const p={status:'clean',cleaned:Date.now()};try{if(db)await db.collection('reports').doc(id).update(p);else{Object.assign(r,p);lsSave()}}catch(e){toast('Das hat nicht geklappt.');return}closeSheet();toast('Vielen Dank fürs Aufräumen!')};
}
init();
</script></body></html>
